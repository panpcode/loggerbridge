version: '3.8'

services:
  loggerbridge:
    build:
      context: ../   
      dockerfile: package/Dockerfile
    ports:
      - "5001:5000"
    volumes:
      - ../:/app 
    environment:
      - FLASK_APP=app.py
      - FLASK_RUN_HOST=0.0.0.0
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"